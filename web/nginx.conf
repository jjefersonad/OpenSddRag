# SPA fallback: unknown app paths serve index.html so React Router handles them.
# Hashed /assets/ must 404 when missing, otherwise a stale index.html keeps
# running an old bundle that nginx would otherwise disguise as HTML.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
